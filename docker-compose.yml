services:
  photo-sorter:
    build: .
    image: photo-sorter:local
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ${PHOTOS_DIR}:/photos:ro
      - photo-data:/data
      - ${BEST_DIR}:/export
    environment:
      PHOTOS_DIR: /photos
      DATA_DIR: /data
      BEST_DIR: /export
      PORT: 8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  photo-data:
