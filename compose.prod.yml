# Production compose for Portainer (no .env file needed).
# NAS pool via mergerfs on the host.
services:
  photo-sorter:
    build: .
    image: photo-sorter:local
    ports:
      - "8420:8080"
    volumes:
      - /srv/mergerfs/pool/pool/photos/Unsorted:/photos:ro
      - photo-data:/data
      - /srv/mergerfs/pool/pool/photos/Best:/export
    environment:
      PHOTOS_DIR: /photos
      DATA_DIR: /data
      BEST_DIR: /export
      PORT: 8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  photo-data:
